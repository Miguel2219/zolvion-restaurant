<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de pedidos</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d38; --ink:#e6edf3; --muted:#8b96a5;
    --accent:#ff7a1a; --ok:#2ea043; --warn:#d29922; --bad:#f0503a;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.45 ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
         background:var(--panel);border-bottom:1px solid var(--line);
         position:sticky;top:0;z-index:5;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-.01em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);
       box-shadow:0 0 0 3px rgba(46,160,67,.18)}
  .dot.off{background:var(--muted);box-shadow:0 0 0 3px rgba(139,150,165,.15)}
  .channel{color:var(--muted);font-size:12.5px}
  .spacer{flex:1}
  header a,header button{color:var(--ink);background:#20262f;border:1px solid var(--line);
       border-radius:9px;padding:7px 13px;font-size:13px;cursor:pointer;text-decoration:none}
  header a:hover,header button:hover{background:#2a313c}
  main{display:grid;gap:14px;padding:16px;
       grid-template-columns:repeat(auto-fit,minmax(270px,1fr));align-items:start}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
       padding:12px;min-height:120px}
  .col h2{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;
          color:var(--muted);display:flex;justify-content:space-between;align-items:center}
  .count{background:#20262f;border-radius:20px;padding:2px 9px;font-size:12px;color:var(--ink)}
  .card{background:#1b222c;border:1px solid var(--line);border-left:3px solid var(--accent);
        border-radius:11px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
  .card.alert{border-left-color:var(--bad);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{background:#2a1c1c}}
  @media (prefers-reduced-motion:reduce){.card.alert{animation:none;background:#2a1c1c}}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .code{font-weight:700;font-size:16px;letter-spacing:-.01em}
  .total{font-weight:700;color:var(--accent);font-size:16px;font-variant-numeric:tabular-nums}
  .meta{color:var(--muted);font-size:12.5px;margin:5px 0 9px}
  ul{list-style:none;margin:0 0 10px;padding:0;font-size:14px}
  li{padding:2px 0}
  li .q{color:var(--accent);font-weight:650}
  .note{color:var(--warn);font-size:12.5px}
  .tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
       border:1px solid var(--line);color:var(--muted);margin:0 5px 4px 0}
  .tag.ok{color:var(--ok);border-color:rgba(46,160,67,.5)}
  .tag.bad{color:var(--bad);border-color:rgba(240,80,58,.55);font-weight:650}
  .tag.warn{color:var(--warn);border-color:rgba(210,153,34,.5)}
  .tag.link{color:var(--accent);border-color:rgba(255,122,26,.45)}
  .flags{background:#2a1c1c;border:1px solid rgba(240,80,58,.4);border-radius:9px;
         padding:9px;margin-bottom:9px;font-size:12.5px;color:#ffb3a7}
  .flags b{color:var(--bad);display:block;margin-bottom:3px}
  .flags.reviewed{background:transparent;border-color:var(--line);color:var(--muted)}
  .flags.reviewed b{color:var(--muted)}
  .handoff{background:#241d0f;border:1px solid rgba(210,153,34,.45);border-radius:9px;
         padding:9px;margin-bottom:9px;font-size:12.5px;color:#f0d38a}
  .handoff b{display:block;margin-bottom:3px}
  .card.needs{border-left-color:var(--warn)}
  .acts{display:flex;gap:7px;flex-wrap:wrap}
  .acts button{flex:1;min-width:88px;border:0;border-radius:9px;padding:9px 10px;
       font-size:13px;font-weight:600;cursor:pointer;background:var(--accent);color:#11161d}
  .acts button.ghost{background:#252c36;color:var(--ink)}
  .acts button.good{background:var(--ok);color:#fff}
  .acts button:hover{filter:brightness(1.08)}
  .receipts{margin-bottom:9px;font-size:13px}
  .receipts>b{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}
  .rcpt{border-top:1px solid var(--line);padding:7px 0}
  .rcpt .rtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
  .eye{background:transparent;border:1px solid var(--line);border-radius:8px;color:var(--ink);cursor:pointer;padding:1px 7px}
  .xbtn{margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:8px;
        color:var(--muted);cursor:pointer;padding:1px 8px;font-size:13px}
  .xbtn:hover{color:var(--bad);border-color:rgba(240,80,58,.55)}
  .photo{max-width:min(92vw,560px);max-height:88vh;border-radius:11px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px}
  .banner{margin:0 16px;padding:10px 14px;border-radius:11px;font-size:13px;
          background:#241d0f;border:1px solid rgba(210,153,34,.4);color:#f0d38a}
  /* modal + toast: no browser dialogs */
  .back{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;
        z-index:50;padding:16px}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:18px;width:min(440px,100%);box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .modal h3{margin:0 0 6px;font-size:16px}
  .modal p{margin:0 0 12px;color:var(--muted);font-size:13px}
  .modal textarea{width:100%;min-height:84px;background:#0d1117;color:var(--ink);
       border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:14px;
       resize:vertical}
  .modal input[type=text]{width:100%;background:#0d1117;color:var(--ink);
       border:1px solid var(--line);border-radius:9px;padding:10px;font:inherit;font-size:14px}
  .modal .err{color:var(--bad);font-size:12.5px;min-height:17px;margin-top:5px}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  .modal button{border:0;border-radius:9px;padding:9px 15px;font-size:13.5px;font-weight:600;
       cursor:pointer;background:var(--accent);color:#11161d}
  .modal button.ghost{background:#252c36;color:var(--ink)}
  #toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
         background:#252c36;border:1px solid var(--line);color:var(--ink);padding:10px 16px;
         border-radius:11px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.45);display:none}
</style>
</head>
<body>
<header>
  <span class="dot" id="live"></span>
  <h1 id="title">Panel de pedidos</h1>
  <span class="channel" id="channel"></span>
  <span class="spacer"></span>
  <a href="/reports">Reportes</a>
  <button onclick="askReset()">Reiniciar demo</button>
</header>
<div class="banner" id="setupbanner" hidden></div>
<main id="board"></main>
<div id="toast"></div>

<script>
const ALERT_SECONDS = Number(new URLSearchParams(location.search).get('alert') || 600);

const COLS = [
  ['CONFIRMED',        'Nuevos'],
  ['ACCEPTED',         'Recibidos'],
  ['READY',            'Listos'],
  ['OUT_FOR_DELIVERY', 'En camino'],
];

// Reject and cancel need a reason: the bot uses it to write to the customer.
const NEXT = {
  CONFIRMED:        [['staff_accepts','Aceptar','good'],  ['staff_rejects','Rechazar','ghost']],
  ACCEPTED:         [['food_ready','Listo','good'],        ['staff_cancels','Cancelar','ghost']],
  READY:            [],
  OUT_FOR_DELIVERY: [['delivered','Entregado','good']],
};
const NEEDS_REASON = {
  staff_rejects: ['Rechazar el pedido', 'El cliente va a recibir este motivo explicado con sus palabras.'],
  staff_cancels: ['Cancelar el pedido', 'El cliente va a recibir este motivo explicado con sus palabras.'],
};

const CHANNEL = {chatwoot:'WhatsApp por Chatwoot', whatsapp:'WhatsApp directo'};

const METODO = {CASH:'Efectivo', TRANSFER:'Transferencia', MIXED:'Mixto', UNSPECIFIED:'Sin especificar'};
// Whether a RECEIPT checks out. Separate from whether the ORDER is paid - the
// money tag below answers that. The map serves each receipt row and the derived
// order-level tag (the worst receipt wins; discarded ones are ignored). A discarded
// receipt or cash row is not on the card at all.
const COMPROBANTE = {
  PENDING:        ['Sin comprobante', ''],
  PROOF_RECEIVED: ['Comprobante recibido', 'warn'],
  FLAGGED:        ['Comprobante por revisar', 'bad'],
  CONFIRMED:      ['Comprobante confirmado', 'ok'],
};
function moneyTag(pay){
  if (!pay.paid) return ['Sin pagar', 'bad'];
  if (pay.outstanding > 0) return [`Pago incompleto · faltan ${money(pay.outstanding)}`, 'warn'];
  return ['Pago completo', 'ok'];
}

const hhmm = iso => new Date(iso).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});
const money = n => '$' + (n||0).toLocaleString('es-CO');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(url, opts){
  const r = await fetch(url, opts);
  let data = null; try { data = await r.json(); } catch(e){}
  if(!r.ok) throw new Error((data && data.error) || ('Error ' + r.status));
  return data;
}

// Same rule as money.pesos on the server: plain digits, or groups of exactly three digits
// with one kind of separator ("26.000", "1.250.000", "47,000"). Anything else is null: a
// decimal must never turn into another amount.
function parsePesos(text){
  const t = String(text).replace(/[$\s ]/g, '');
  if(/^[0-9]+$/.test(t)) return Number(t);
  if(/^[0-9]{1,3}([.,])[0-9]{3}(\1[0-9]{3})*$/.test(t)) return Number(t.replace(/[.,]/g, ''));
  return null;
}
const NOT_PESOS = 'Escriba el monto en pesos, sin decimales (por ejemplo 26000 o 26.000).';

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.display = 'none', 3800);
}

// noField: a plain yes/no prompt. No input is rendered, the confirm button takes
// the focus and onConfirm receives ''. numeric: a text box with the numeric keypad, not
// an input of type number: that one reads "26.000" as 26 and its arrows round a typed
// decimal. validate: value -> error text or ''; a text keeps the dialog open and posts
// nothing.
function modal({title, help, placeholder, confirmText, required, numeric, value, validate, noField, onConfirm}){
  const back = document.createElement('div');
  back.className = 'back';
  const field = noField ? ''
    : numeric
    ? `<input id="mtext" type="text" inputmode="numeric" autocomplete="off" value="${esc(value ?? '')}">`
    : `<textarea id="mtext" placeholder="${esc(placeholder||'')}"></textarea>`;
  back.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3><p>${esc(help)}</p>
      ${field}
      <div class="err" id="merr"></div>
      <div class="row"><button class="ghost" id="mno">Volver</button>
      <button id="myes">${esc(confirmText)}</button></div></div>`;
  document.body.appendChild(back);
  const box = back.querySelector('#mtext');          // null when there is no field
  const yes = back.querySelector('#myes');
  (box || yes).focus();
  const close = () => back.remove();
  back.querySelector('#mno').onclick = close;
  back.onclick = e => { if(e.target === back) close(); };
  yes.onclick = async () => {
    const value = box ? box.value.trim() : '';
    if(box && required && !value){
      back.querySelector('#merr').textContent = numeric ? 'Escribe el monto.' : 'Escribe el motivo.';
      return;
    }
    const problem = validate ? validate(value) : '';
    if(problem){
      back.querySelector('#merr').textContent = problem;
      return;
    }
    close();
    try { await onConfirm(value); } catch(e){ toast(e.message); }
  };
  (box || yes).addEventListener('keydown', e => {
    if(e.key === 'Enter' && (e.ctrlKey || e.metaKey)){
      e.preventDefault();                           // the button would also click on its own
      yes.click();
    }
    if(e.key === 'Escape') close();
  });
}

// One payment receipt: its own status, flags, photo and buttons. Only a receipt
// that still waits for a person can be confirmed or discarded (the X).
function receiptRow(orderId, r){
  const [label, cls] = COMPROBANTE[r.status] || [r.status, ''];
  const waiting = r.status === 'PROOF_RECEIVED' || r.status === 'FLAGGED';
  const flagText = (r.flags || []).map(f => esc(f)).join('<br>');
  const flags = !flagText ? ''
    : waiting ? `<div class="flags"><b>⚠ Comprobante con inconsistencias</b>${flagText}</div>`
    : `<div class="flags reviewed"><b>✓ Revisado</b>${flagText}</div>`;
  // Only a clean number is safe to inline into the onclick attribute below - an
  // amount the OCR could not read falls back to null, and staff types it.
  const prefill = Number.isInteger(r.amount) ? r.amount : 'null';
  return `<div class="rcpt">
    <div class="rtop">
      <span>${hhmm(r.received_at)}</span>
      <b>${r.amount == null ? 'monto ilegible' : money(r.amount)}</b>
      <span class="tag ${cls}">${esc(label)}${r.status === 'CONFIRMED' ? ' · ' + money(r.confirmed_amount) : ''}</span>
      ${r.has_photo
        ? `<button class="eye" title="Ver comprobante" onclick="showPhoto(${r.id})">👁</button>`
        : '<span class="tag">sin foto</span>'}
      ${waiting
        ? `<button class="xbtn" title="Descartar" aria-label="Descartar comprobante" onclick="discardReceipt(${orderId}, ${r.id})">✕</button>` : ''}
    </div>
    ${(r.notes || []).map(n => `<span class="tag">${esc(n)}</span>`).join('')}
    ${flags}
    ${waiting
      ? `<div class="acts">
           <button class="ghost" onclick="confirmReceipt(${orderId}, ${r.id}, ${prefill})">Confirmar</button>
         </div>` : ''}
  </div>`;
}

// One cash registration. The person who registered it already holds the money, so
// there is no Confirmar: only the X, for a registration made by mistake.
function cashRow(orderId, c){
  return `<div class="rcpt">
    <div class="rtop">
      <span>${hhmm(c.registered_at)}</span>
      <b>${money(c.amount)}</b>
      <span class="tag ok">Efectivo recibido</span>
      <button class="xbtn" title="Descartar" aria-label="Descartar efectivo" onclick="discardCash(${orderId}, ${c.id})">✕</button>
    </div>
  </div>`;
}

// The "Pagos" block: receipts and cash registrations in one list, oldest first.
// Discarded rows leave the card entirely.
function paymentRows(orderId, pay){
  const rows = [
    ...(pay.receipts || []).filter(r => r.status !== 'DISCARDED')
      .map(r => [r.received_at, receiptRow(orderId, r)]),
    ...(pay.cash || []).filter(c => c.status === 'RECEIVED')
      .map(c => [c.registered_at, cashRow(orderId, c)]),
  ];
  rows.sort((a, b) => (a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0));
  return rows.map(r => r[1]).join('');
}

function card(o){
  const secs = (Date.now() - Date.parse(o.created_at)) / 1000;
  const stuck = o.state === 'CONFIRMED' && secs > ALERT_SECONDS;
  const pay = o.payment || {};
  const [proofLabel, proofClass] = COMPROBANTE[pay.status] || [pay.status || 'Sin comprobante', ''];
  // "Sin comprobante" only matters where a transfer is still expected; on a cash or
  // unspecified order, or one whose transfer part cash already paid, it read like an
  // unpaid order next to "Pago completo".
  const showProof = pay.status !== 'PENDING' || (['TRANSFER', 'MIXED'].includes(pay.method) && (pay.transfer_due || 0) > 0);
  const [moneyLabel, moneyClass] = moneyTag(pay);
  const showRegisterCash = (pay.outstanding || 0) > 0;
  // On a cash or mixed order the driver collects what is still owed in cash, not the
  // agreed cash part: a transfer that is waiting or was confirmed above its share
  // already covers some of it. `outstanding` only counts confirmed receipts.
  const cashOwed = ['CASH', 'MIXED'].includes(pay.method) && (pay.cash_due || 0) > 0;
  const cashPrefill = cashOwed ? pay.cash_due : pay.outstanding;
  const payRows = paymentRows(o.id, pay);
  const handoffs = o.handoffs || [];
  const confirmedAt = (o.transitions || []).find(t => t.to_state === 'CONFIRMED');
  const showUpdated = o.state === 'CONFIRMED' && o.edited_at && confirmedAt && o.edited_at > confirmedAt.at;
  const acts = (NEXT[o.state] || []).slice();
  if (o.state === 'READY') {
    acts.push(o.fulfilment_type === 'DELIVERY'
      ? ['driver_leaves','Sale a domicilio','good']
      : ['hand_over','Entregado','good']);
    acts.push(['mark_in_error','Volver a preparar','ghost']);
  }
  return `<div class="card ${stuck ? 'alert' : ''} ${handoffs.length ? 'needs' : ''}">
    <div class="top"><span class="code">${esc(o.code)}</span><span class="total">${money(o.total)}</span></div>
    <div class="meta">
      ${o.fulfilment_type === 'DELIVERY' ? '🛵 Domicilio' : '🏠 Recoge'}
      ${o.address ? '· ' + esc(o.address) : ''} · ${esc(o.phone)}
      ${stuck ? ' · <b style="color:var(--bad)">sin aceptar hace ' + Math.floor(secs/60) + ' min</b>' : ''}
    </div>
    <ul>${o.items.map(i => `<li><span class="q">${i.qty}×</span> ${esc(i.name)}
        ${i.modifiers && i.modifiers.length ? '<span class="note">(' + esc(i.modifiers.join(', ')) + ')</span>' : ''}
        ${i.note ? '<span class="note"> — ' + esc(i.note) + '</span>' : ''}</li>`).join('')}</ul>
    <div style="margin-bottom:9px">
      ${showUpdated ? `<span class="tag warn">Actualizado ${hhmm(o.edited_at)}</span>` : ''}
      <span class="tag">${esc(METODO[pay.method] || 'Sin especificar')}</span>
      ${showProof ? `<span class="tag ${proofClass}">${esc(proofLabel)}</span>` : ''}
      <span class="tag ${moneyClass}">${esc(moneyLabel)}</span>
      ${cashOwed ? `<span class="tag warn">Efectivo por cobrar ${money(pay.cash_due)}</span>` : ''}
      ${pay.overpayment_amount ? `<span class="tag warn">Sobrepago ${money(pay.overpayment_amount)}</span>` : ''}
      ${o.delivery_fee ? '<span class="tag">domicilio ' + money(o.delivery_fee) + '</span>' : ''}
      ${o.related_order_id ? '<span class="tag link">pedido aparte</span>' : ''}
      ${o.chatwoot_link ? `<a class="tag link" href="${esc(o.chatwoot_link)}" target="_blank" rel="noopener">ver conversación</a>` : ''}
    </div>
    ${handoffs.length
      ? `<div class="handoff"><b>🙋 Necesita a una persona</b>
          ${handoffs.some(h => h.chatwoot_failed) ? '<span class="tag bad">Chatwoot sin actualizar</span><br>' : ''}
          ${handoffs.map(h => `${hhmm(h.created_at)} · ${esc(h.summary)}`).join('<br>')}
          <div class="acts" style="margin-top:7px">
            <button class="ghost" onclick="resolveHandoff(${o.id})">Ya lo atendí</button>
          </div></div>` : ''}
    ${payRows
      ? `<div class="receipts"><b>Pagos</b>${payRows}</div>` : ''}
    ${showRegisterCash
      ? `<div class="acts" style="margin-bottom:7px">
           <button class="ghost" onclick="registerCash(${o.id}, ${cashPrefill}, ${pay.outstanding || 0})">Registrar efectivo recibido</button>
         </div>` : ''}
    <div class="acts">${acts.map(([e,l,c]) =>
      `<button class="${c}" onclick="ev(${o.id},'${e}')">${l}</button>`).join('')}</div>
  </div>`;
}

async function draw(){
  let orders;
  try { ({ orders } = await api('/api/board')); }
  catch(e){ return; }                       // server restarting: keep the last view
  document.getElementById('board').innerHTML = COLS.map(([state, label]) => {
    const list = orders.filter(o => o.state === state);
    return `<section class="col"><h2>${label}<span class="count">${list.length}</span></h2>
      ${list.length ? list.map(card).join('') : '<div class="empty">Sin pedidos</div>'}</section>`;
  }).join('');
}

async function send(id, event, reason){
  await api(`/api/orders/${id}/event`, {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify(reason ? {event, reason} : {event}),
  });
  await draw();
}

function ev(id, event){
  const needs = NEEDS_REASON[event];
  if(!needs){ send(id, event).catch(e => toast(e.message)); return; }
  const [title, help] = needs;
  modal({
    title, help, required: true, confirmText: 'Enviar y avisar al cliente',
    placeholder: 'Ej: se nos acabó el maduro, o ya cerramos la cocina por hoy',
    onConfirm: reason => send(id, event, reason),
  });
}

function resolveHandoff(id){
  api(`/api/orders/${id}/handoff/resolve`, {method:'POST'})
    .then(draw)
    .catch(e => toast(e.message));
}

function confirmReceipt(orderId, receiptId, prefill){
  modal({
    title: 'Confirmar comprobante',
    help: 'Monto que realmente llegó con este comprobante.',
    numeric: true, required: true, value: prefill, confirmText: 'Confirmar',
    validate: v => parsePesos(v) == null ? NOT_PESOS : '',
    onConfirm: async amount => {
      await api(`/api/orders/${orderId}/receipts/${receiptId}/confirm`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({amount}),
      });
      await draw();
    },
  });
}

function discardReceipt(orderId, receiptId){
  modal({
    title: '¿Descartar este comprobante?',
    help: '¿Por qué se descarta este comprobante? El cliente recibirá este motivo.',
    required: true, confirmText: 'Descartar y avisar al cliente',
    placeholder: 'Ej: este comprobante llegó por error; su pago ya estaba completo',
    onConfirm: async reason => {
      await api(`/api/orders/${orderId}/receipts/${receiptId}/discard`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({reason}),
      });
      await draw();
    },
  });
}

// A cash registration made by mistake. Nobody is told: the customer never saw it.
function discardCash(orderId, cashId){
  modal({
    title: '¿Descartar este efectivo?',
    help: '¿Por qué se descarta este registro de efectivo? El cliente no recibe ningún mensaje.',
    required: true, confirmText: 'Descartar',
    placeholder: 'Ej: se registró en el pedido equivocado',
    onConfirm: async reason => {
      await api(`/api/orders/${orderId}/cash/${cashId}/discard`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({reason}),
      });
      await draw();
    },
  });
}

// Appended to body, not to #board: the board is redrawn every 2 s and would take
// the overlay with it.
function showPhoto(id){
  const back = document.createElement('div');
  back.className = 'back';
  back.innerHTML = `<img class="photo" src="/api/receipts/${id}/photo" alt="Comprobante">`;
  const onKey = e => { if(e.key === 'Escape') close(); };
  const close = () => { back.remove(); document.removeEventListener('keydown', onKey); };
  back.onclick = close;
  document.addEventListener('keydown', onKey);
  document.body.appendChild(back);
}

// Cash registered by mistake is fixed with the X on its row, so there is no warning here.
function registerCash(id, prefill, outstanding){
  const tooMuch = `El monto es mayor de lo que falta (${money(outstanding)}). `
    + 'Registre solo lo que falta; el cambio lo maneja el local.';
  modal({
    title: 'Registrar efectivo recibido',
    help: `Efectivo cobrado para este pedido, sin contar el cambio. Falta ${money(outstanding)}.`,
    numeric: true, required: true, value: prefill,
    validate: amount => {
      const n = parsePesos(amount);
      return n == null ? NOT_PESOS : n > outstanding ? tooMuch : '';
    },
    confirmText: 'Registrar',
    onConfirm: async amount => {
      await api(`/api/orders/${id}/payment/cash`, {
        method:'POST', headers:{'content-type':'application/json'},
        body: JSON.stringify({amount}),
      });
      await draw();
    },
  });
}

function askReset(){
  modal({
    title: 'Reiniciar la demo',
    help: 'Esto BORRA la base de datos: todos los pedidos, pagos, conversaciones y los reportes vuelven a cero. No se puede deshacer.',
    placeholder: '', required: false, confirmText: 'Sí, borrar todo',
    onConfirm: async () => { await api('/api/reset', {method:'POST'}); await draw(); toast('Demo reiniciada.'); },
  });
}

api('/api/config').then(c => {
  document.getElementById('title').textContent = c.business.name + ' · Panel de pedidos';
  document.title = c.business.short_name + ' · Panel';
  document.getElementById('live').className = 'dot' + (c.live_whatsapp ? '' : ' off');
  document.getElementById('channel').textContent = CHANNEL[c.channel] || '';
  const banner = document.getElementById('setupbanner');
  banner.textContent = c.channel === 'incomplete'
    ? `Falta configurar Chatwoot (${c.missing.join(', ')}): no entran ni salen mensajes de WhatsApp.`
    : c.channel === 'none' ? 'WhatsApp no está conectado: los mensajes al cliente no salen.' : '';
  banner.hidden = !banner.textContent;
}).catch(() => {});
draw(); setInterval(draw, 2000);
